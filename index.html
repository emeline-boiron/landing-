<!DOCTYPE html>

<html>

  <head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Sous le regard</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/1f690b5f25.js" crossorigin="anonymous"></script>
  </head>

  <body>

    <div class="banner">
      <div class="container">
        <h1>Sous le regard <i class="fa-solid fa-palette"></i></h1>
        <h2>Learn about art</h2>
        <p style="max-width: 600px; margin: 15 px; color: #F5F2EB; line-height: 1.6; font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 500;">
          Explore major art movements, dive into the heart of museums around the world, and let yourself be inspired by the beauty of creation.
          </p>
        <a href='#apply-section' class="btn-blue" style="display: inline-block; margin-top: 20px;">Start now</a>
      </div>
    </div>


    <div class="container">



    <h2>sections</h2>

    <div class="cards">

      <div class="card">
        <img src="images/museum.jpg" alt="museum">
        <h3>visits of museum <i class="fa-solid fa-camera"></i></h3>
      </div>

      <div class="card">
        <img src="images/history.jpg" alt="history">
        <h3>history of art <i class="fa-solid fa-book"></i></h3>
      </div>

      <div class="card">
        <img src="images/creation.jpg" alt="creation">
        <h3>creation <i class="fa-solid fa-paintbrush"></i></h3>
      </div>
    </div>


    </div>

<form action="#" method="POST" id="apply-section">
  <div>
    <label for="prenom">Name :</label>
    <input type="text" id="prenom" name="prenom" required>
  </div>

  <div>
    <label for="email">E-mail :</label>
    <input type="email" id="email" name="email" required>
  </div>

  <div>
    <label for="telephone">Phone number :</label>
    <input type="tel" id="telephone" name="telephone">
  </div>

  <button type="submit">Send</button>
</form>








<div class="carousel">
  <img class="carousel-image active" src="images/femme.jpg">
  <img class="carousel-image" src="images/glace.jpg">
  <img class="carousel-image" src="images/meduse.jpg">
  <img class="carousel-image" src="images/monet.jpg">
  <img class="carousel-image" src="images/nuage.jpg" alt="Art 5">
  <img class="carousel-image" src="images/venus.jpg">
</div>

<script src="javascript.js"></script>






  </body>
</html>
